<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lady Heal · Prototype</title><style>
:root{--cream:#F7F3EC;--sand:#DCCEBF;--sage:#8C9887;--brown:#6A5448;--ink:#3C322D;--white:#fff;--line:#e8e0d7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:#f0eae1;border-right:1px solid var(--line);padding:30px 18px}.brand{font-family:Georgia,serif;font-size:29px;letter-spacing:2px;text-align:center;color:var(--brown)}.subtitle{text-align:center;letter-spacing:2px;font-size:10px;margin:7px 0 35px}.nav{display:block;width:100%;padding:13px 15px;border:0;background:transparent;text-align:left;border-radius:11px;color:var(--brown);margin:4px 0}.nav.active,.nav:hover{background:var(--sage);color:white}.side-note{font-size:11px;line-height:1.5;margin-top:35px;color:#796c63}main{padding:28px clamp(18px,4vw,58px);max-width:1450px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--sage);font-weight:700}h1{font-family:Georgia,serif;font-weight:400;font-size:34px;margin:6px 0}h2{font-family:Georgia,serif;font-weight:400;margin:0 0 16px;font-size:24px}h3{font-size:16px;margin:0 0 12px}.muted{color:#877970;font-size:13px}.pill{border-radius:30px;background:#e4eadd;color:#52634f;padding:6px 10px;font-size:12px}.btn{background:var(--sage);border:1px solid var(--sage);color:#fff;padding:10px 16px;border-radius:9px}.btn.secondary{background:white;color:var(--brown);border-color:var(--line)}.btn:focus,.nav:focus,input:focus,select:focus,textarea:focus{outline:2px solid var(--brown);outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:21px;box-shadow:0 5px 20px #5a49340b}.metric{font-family:Georgia,serif;font-size:30px;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.section{margin-top:23px}.search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:white}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line)}th{font-size:12px;color:#84766e;font-weight:600}tr.clickable{cursor:pointer}tr.clickable:hover{background:#f7f7f3}.tag{font-size:12px;background:#eef0e9;padding:5px 9px;border-radius:20px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:block;color:#6d5e54;font-size:12px;font-weight:600}input,select,textarea{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #ded6cc;border-radius:8px;background:#fff;color:var(--ink)}textarea{min-height:95px;resize:vertical}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:9px;color:var(--brown)}.tab.active{background:var(--brown);color:white}.alert{padding:12px 15px;border:1px solid #d7c7a8;background:#fff8e9;border-radius:10px;font-size:13px;margin-bottom:20px}.empty{padding:28px;text-align:center;color:#85766c}.hide{display:none}.field{margin-bottom:14px}.small{font-size:12px}.appointment{padding:12px;border-bottom:1px solid var(--line)}.appointment:last-child{border:0}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.app{grid-template-columns:1fr}aside{padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:22px}.subtitle,.side-note{display:none}.navs{display:flex;overflow:auto;gap:6px}.nav{white-space:nowrap;width:auto}.top{align-items:flex-start}main{padding:20px}}@media(max-width:550px){.grid,.formgrid{grid-template-columns:1fr}h1{font-size:28px}}
</style></head><body><div class="app"><aside><div class="brand">LADY HEAL</div><div class="subtitle">CARE · WELLNESS · BEAUTY</div><div class="navs" id="nav"></div><div class="side-note" id="sideNote"></div></aside><main><div class="top"><div><div class="eyebrow">LADY HEAL / PRIVATE WORKSPACE</div><h1 id="title"></h1></div><button class="btn secondary" id="language">English</button></div><div class="alert" id="warning"></div><div id="content"></div></main></div><script>
const dict={es:{dashboard:'Panel principal',clients:'Clientes',appointments:'Citas',soap:'Notas SOAP',billing:'Paquetes y pagos',forms:'Evaluaciones',demo:'PROTOTIPO CON DATOS FICTICIOS. No introduzcas información médica real: este archivo no tiene autenticación, cifrado ni servidor seguro.',today:'Citas registradas',active:'Clientes',pending:'Saldo pendiente',sessions:'Sesiones disponibles',recent:'Próximas citas',quick:'Búsqueda rápida',search:'Buscar por nombre, teléfono o correo…',name:'Nombre',phone:'Teléfono',email:'Correo',treatment:'Tratamiento',actions:'Acciones',open:'Abrir expediente',newClient:'Nuevo cliente',save:'Guardar',cancel:'Cancelar',profile:'Expediente',overview:'Resumen',medical:'Historia clínica',photos:'Fotografías',back:'Volver a clientes',dob:'Fecha de nacimiento',notes:'Observaciones',emergency:'Contacto de emergencia',facial:'Evaluación facial',postop:'Evaluación postoperatoria y drenaje',allergies:'Alergias',medications:'Medicamentos',conditions:'Antecedentes médicos',surgery:'Cirugía y fecha',surgeon:'Cirujano',contra:'Contraindicaciones / precauciones',skin:'Tipo de piel',fitz:'Fototipo Fitzpatrick',concerns:'Condiciones de la piel',products:'Productos actuales',s:'S — Subjetivo',o:'O — Objetivo',a:'A — Evaluación',p:'P — Plan',newSOAP:'Nueva nota SOAP',client:'Cliente',date:'Fecha',service:'Servicio',status:'Estado',newAppt:'Nueva cita',time:'Hora',duration:'Duración (min)',location:'Lugar',package:'Paquete',price:'Precio total ($)',paid:'Pagado ($)',used:'Sesiones utilizadas',total:'Total de sesiones',newPackage:'Nuevo paquete',noData:'Sin registros todavía.',photoNote:'En esta versión inicial no se almacenan fotografías. Esta función se habilitará con almacenamiento privado y seguro.',completed:'Completada',scheduled:'Programada',cancelled:'Cancelada',details:'Detalles',select:'Seleccionar cliente',paymentNote:'Los pagos se registran manualmente; Square sigue siendo el procesador de pagos.',required:'Completa los campos obligatorios.',saved:'Guardado en este navegador (solo demostración).',demoOnly:'Los cambios de esta demostración se guardan únicamente en este navegador. No uses datos reales.',deleteDemo:'Restablecer demostración',confirmReset:'¿Restablecer todos los datos de demostración?',none:'Sin coincidencias',view:'Ver'},en:{dashboard:'Dashboard',clients:'Clients',appointments:'Appointments',soap:'SOAP Notes',billing:'Packages & Payments',forms:'Assessments',demo:'DEMO WITH FICTIONAL DATA. Do not enter real medical information: this file has no authentication, encryption, or secure server.',today:'Scheduled appointments',active:'Clients',pending:'Outstanding balance',sessions:'Sessions remaining',recent:'Upcoming appointments',quick:'Quick search',search:'Search by name, phone or email…',name:'Name',phone:'Phone',email:'Email',treatment:'Treatment',actions:'Actions',open:'Open profile',newClient:'New client',save:'Save',cancel:'Cancel',profile:'Client profile',overview:'Overview',medical:'Medical history',photos:'Photos',back:'Back to clients',dob:'Date of birth',notes:'Notes',emergency:'Emergency contact',facial:'Facial assessment',postop:'Postoperative & lymphatic assessment',allergies:'Allergies',medications:'Medications',conditions:'Medical history',surgery:'Surgery and date',surgeon:'Surgeon',contra:'Contraindications / precautions',skin:'Skin type',fitz:'Fitzpatrick phototype',concerns:'Skin concerns',products:'Current products',s:'S — Subjective',o:'O — Objective',a:'A — Assessment',p:'P — Plan',newSOAP:'New SOAP note',client:'Client',date:'Date',service:'Service',status:'Status',newAppt:'New appointment',time:'Time',duration:'Duration (min)',location:'Location',package:'Package',price:'Total price ($)',paid:'Paid ($)',used:'Sessions used',total:'Total sessions',newPackage:'New package',noData:'No records yet.',photoNote:'Photos are not stored in this initial version. This feature requires secure private storage.',completed:'Completed',scheduled:'Scheduled',cancelled:'Cancelled',details:'Details',select:'Select client',paymentNote:'Payments are entered manually; Square remains your payment processor.',required:'Please complete the required fields.',saved:'Saved in this browser (demo only).',demoOnly:'Changes in this demo are stored only in this browser. Do not use real data.',deleteDemo:'Reset demo',confirmReset:'Reset all demo data?',none:'No matches',view:'View'}};
let lang=localStorage.getItem('lh_lang')||'es',page='dashboard',selected=null,tab='overview',showForm=false,filter='';const sample={clients:[{id:'c1',name:'Alex Morgan (DEMO)',phone:'(555) 010-1001',email:'alex@example.com',dob:'1990-04-12',emergency:'',notes:''},{id:'c2',name:'Jordan Lee (DEMO)',phone:'(555) 010-1002',email:'jordan@example.com',dob:'1987-11-20',emergency:'',notes:''}],appointments:[{id:'a1',client:'c1',date:'2026-10-28',time:'10:00',service:'Lymphatic drainage',duration:60,location:'Spa',status:'scheduled'},{id:'a2',client:'c2',date:'2026-10-29',time:'14:00',service:'Facial',duration:90,location:'Spa',status:'scheduled'}],packages:[{id:'p1',client:'c1',service:'Postoperative care',total:10,used:4,price:1200,paid:600}],soaps:[],assessments:[]};let db;try{db=JSON.parse(localStorage.getItem('lh_demo_db'))||structuredClone(sample)}catch{db=structuredClone(sample)};function persist(){localStorage.setItem('lh_demo_db',JSON.stringify(db))}function t(k){return dict[lang][k]||k}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function client(id){return db.clients.find(x=>x.id===id)}function cname(id){return client(id)?.name||'—'}function money(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function id(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function navto(p){page=p;selected=null;showForm=false;filter='';render()}function openClient(cid,which='overview'){page='profile';selected=cid;tab=which;showForm=false;render()}function btn(text,fn,cls='btn'){return `<button class="${cls}" onclick="${fn}">${text}</button>`}function fields(items){return items.map(([key,label,type='text',required=false])=>`<label class="field">${t(label)}<${type==='textarea'?'textarea':'input'} name="${key}" ${type==='textarea'?'':`type="${type}"`} ${required?'required':''}>${type==='textarea'?'</textarea>':''}${type==='textarea'?'':'</input>'}</label>`).join('')}function clientOptions(){return db.clients.map(c=>`<option value="${esc(c.id)}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('')}function formWrap(inner,submit){return `<form id="entry" onsubmit="${submit}(event)" class="card section"><div class="formgrid">${inner}</div><div class="row">${btn(t('save'),'','btn submit')}<button type="submit" class="btn">${t('save')}</button>${btn(t('cancel'),'showForm=false;render()','btn secondary')}</div></form>`.replace('<button class="btn submit" onclick=""></button>','')};function form(inner,submit){return `<form class="card section" onsubmit="${submit}(event)"><div class="formgrid">${inner}</div><div class="row"><button type="submit" class="btn">${t('save')}</button>${btn(t('cancel'),'showForm=false;render()','btn secondary')}</div></form>`}function data(e){e.preventDefault();return Object.fromEntries(new FormData(e.target).entries())}function done(){persist();showForm=false;render()}
function render(){document.documentElement.lang=lang;document.getElementById('language').textContent=lang==='es'?'English':'Español';document.getElementById('warning').textContent=t('demo');document.getElementById('sideNote').textContent=t('demoOnly');let names=['dashboard','clients','appointments','soap','billing','forms'];document.getElementById('nav').innerHTML=names.map((p,i)=>`<button class="nav ${page===p||(page==='profile'&&p==='clients')?'active':''}" onclick="navto('${p}')">${['◫','♙','▦','✎','＄','♡'][i]} &nbsp;${t(p)}</button>`).join('');document.getElementById('title').textContent=page==='profile'?t('profile'):t(page);document.getElementById('content').innerHTML=({dashboard:dashboard,clients:clients,profile:profile,appointments:appointments,soap:soap,billing:billing,forms:assessments})[page]();if(page==='clients'){let s=document.getElementById('q');s.value=filter;s.focus();s.setSelectionRange(s.value.length,s.value.length)}}function clientRows(list){return `<div class="tablewrap"><table><thead><tr><th>${t('name')}</th><th>${t('phone')}</th><th>${t('email')}</th><th>${t('actions')}</th></tr></thead><tbody>${list.map(c=>`<tr class="clickable" onclick="openClient('${c.id}')"><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td><span class="tag">${t('view')} →</span></td></tr>`).join('')}</tbody></table></div>${list.length?'':`<div class="empty">${t('none')}</div>`}`}function dashboard(){let bal=db.packages.reduce((a,p)=>a+Number(p.price)-Number(p.paid),0),rem=db.packages.reduce((a,p)=>a+Number(p.total)-Number(p.used),0);return `<div class="grid">${[[t('today'),db.appointments.filter(a=>a.status==='scheduled').length],[t('active'),db.clients.length],[t('pending'),money(bal)],[t('sessions'),rem]].map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="metric">${v}</div></div>`).join('')}</div><div class="columns section"><div class="card"><h2>${t('quick')}</h2><input class="search" placeholder="${t('search')}" oninput="document.getElementById('quickResults').innerHTML=clientRows(db.clients.filter(c=>(c.name+' '+c.phone+' '+c.email).toLowerCase().includes(this.value.toLowerCase())))"><div id="quickResults">${clientRows(db.clients)}</div></div><div class="card"><h2>${t('recent')}</h2>${db.appointments.filter(a=>a.status==='scheduled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6).map(a=>`<div class="appointment"><b>${esc(cname(a.client))}</b><div class="muted">${esc(a.date)} · ${esc(a.time)} · ${esc(a.service)}</div></div>`).join('')||t('noData')}</div></div>`}function clients(){let list=db.clients.filter(c=>(c.name+' '+c.phone+' '+c.email).toLowerCase().includes(filter.toLowerCase()));return `<div class="row"><div class="muted">${db.clients.length} ${t('clients').toLowerCase()}</div>${btn('+ '+t('newClient'),'showForm=!showForm;render()')}</div>${showForm?form(fields([['name','name','text',true],['phone','phone','tel'],['email','email','email'],['dob','dob','date'],['emergency','emergency'],['notes','notes','textarea']]),'addClient'):''}<div class="section"><input id="q" class="search" placeholder="${t('search')}" oninput="filter=this.value;document.getElementById('clientList').innerHTML=clientRows(db.clients.filter(c=>(c.name+' '+c.phone+' '+c.email).toLowerCase().includes(filter.toLowerCase())))"><div id="clientList" class="card section">${clientRows(list)}</div></div>`}function addClient(e){let x=data(e);db.clients.push({...x,id:id()});done()}function profile(){let c=client(selected);if(!c)return `<p>${t('noData')}</p>`;let tabs=['overview','medical','soap','billing','appointments','photos'];return `${btn('← '+t('back'),"navto('clients')",'btn secondary')}<div class="card section"><h2>${esc(c.name)}</h2><div class="muted">${esc(c.phone)} · ${esc(c.email)} · ${esc(c.dob)}</div></div><div class="tabs">${tabs.map(k=>`<button class="tab ${tab===k?'active':''}" onclick="tab='${k}';showForm=false;render()">${t(k)}</button>`).join('')}</div>${tab==='overview'?`<div class="columns"><div class="card"><h3>${t('details')}</h3><p>${t('emergency')}: ${esc(c.emergency)||'—'}</p><p>${t('notes')}: ${esc(c.notes)||'—'}</p></div><div class="card"><h3>${t('package')}</h3>${db.packages.filter(p=>p.client===c.id).map(p=>`<p>${esc(p.service)} · ${p.total-p.used} / ${p.total} ${t('sessions').toLowerCase()} · ${money(p.price-p.paid)}</p>`).join('')||t('noData')}</div></div>`:tab==='medical'?assessmentContent(c.id):tab==='soap'?soapContent(c.id):tab==='billing'?billingContent(c.id):tab==='appointments'?appointmentContent(c.id):`<div class="card">${t('photoNote')}</div>`}`}function assessmentContent(cid){let records=db.assessments.filter(x=>!cid||x.client===cid);return `<div class="row"><div class="muted">${t('medical')}</div>${btn('+ '+t('forms'),'showForm=!showForm;render()')}</div>${showForm?form(`<label>${t('client')}<select name="client" required>${clientOptions()}</select></label><label>${t('forms')}<select name="type"><option value="postop">${t('postop')}</option><option value="facial">${t('facial')}</option></select></label>${fields([['date','date','date',true],['conditions','conditions','textarea'],['allergies','allergies','textarea'],['medications','medications','textarea'],['surgery','surgery','textarea'],['surgeon','surgeon'],['contra','contra','textarea'],['skin','skin'],['fitz','fitz'],['concerns','concerns','textarea'],['products','products','textarea']])}`,'addAssessment'):''}<div class="section">${records.map(r=>`<div class="card section"><div class="row"><b>${esc(cname(r.client))} · ${t(r.type)}</b><span class="pill">${esc(r.date)}</span></div>${['conditions','allergies','medications','surgery','surgeon','contra','skin','fitz','concerns','products'].filter(k=>r[k]).map(k=>`<p><b>${t(k)}:</b> ${esc(r[k])}</p>`).join('')}</div>`).join('')||`<div class="card empty">${t('noData')}</div>`}</div>`}function addAssessment(e){db.assessments.push({...data(e),id:id()});done()}function assessments(){return assessmentContent(null)}function soapContent(cid){let list=db.soaps.filter(x=>!cid||x.client===cid);return `<div class="row"><span class="muted">SOAP</span>${btn('+ '+t('newSOAP'),'showForm=!showForm;render()')}</div>${showForm?form(`<label>${t('client')}<select name="client" required>${clientOptions()}</select></label>${fields([['date','date','date',true],['service','service','text',true],['s','s','textarea',true],['o','o','textarea',true],['a','a','textarea',true],['p','p','textarea',true]])}`,'addSOAP'):''}<div class="section">${list.map(r=>`<div class="card section"><div class="row"><b>${esc(cname(r.client))} · ${esc(r.service)}</b><span class="pill">${esc(r.date)}</span></div>${['s','o','a','p'].map(k=>`<p><b>${t(k)}:</b> ${esc(r[k])}</p>`).join('')}</div>`).join('')||`<div class="card empty">${t('noData')}</div>`}</div>`}function addSOAP(e){db.soaps.push({...data(e),id:id()});done()}function soap(){return soapContent(null)}function appointmentContent(cid){let list=db.appointments.filter(x=>!cid||x.client===cid).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="row"><span class="muted">${t('appointments')}</span>${btn('+ '+t('newAppt'),'showForm=!showForm;render()')}</div>${showForm?form(`<label>${t('client')}<select name="client" required>${clientOptions()}</select></label>${fields([['date','date','date',true],['time','time','time',true],['service','service','text',true],['duration','duration','number',true],['location','location']])}<label>${t('status')}<select name="status"><option value="scheduled">${t('scheduled')}</option><option value="completed">${t('completed')}</option><option value="cancelled">${t('cancelled')}</option></select></label>`,'addAppointment'):''}<div class="card section tablewrap"><table><thead><tr>${['date','time','client','service','status'].map(x=>`<th>${t(x)}</th>`).join('')}</tr></thead><tbody>${list.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.time)}</td><td>${esc(cname(a.client))}</td><td>${esc(a.service)}</td><td><select aria-label="${t('status')}" onchange="changeStatus('${a.id}',this.value)">${['scheduled','completed','cancelled'].map(k=>`<option value="${k}" ${a.status===k?'selected':''}>${t(k)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>${list.length?'':`<div class="empty">${t('noData')}</div>`}</div>`}function addAppointment(e){db.appointments.push({...data(e),id:id()});done()}function changeStatus(aid,v){let a=db.appointments.find(x=>x.id===aid);if(a){a.status=v;persist();render()}}function appointments(){return appointmentContent(null)}function billingContent(cid){let list=db.packages.filter(x=>!cid||x.client===cid);return `<div class="row"><span class="muted">${t('paymentNote')}</span>${btn('+ '+t('newPackage'),'showForm=!showForm;render()')}</div>${showForm?form(`<label>${t('client')}<select name="client" required>${clientOptions()}</select></label>${fields([['service','service','text',true],['total','total','number',true],['used','used','number',true],['price','price','number',true],['paid','paid','number',true]])}`,'addPackage'):''}<div class="card section tablewrap"><table><thead><tr>${['client','service','total','used','paid','pending'].map(x=>`<th>${t(x)}</th>`).join('')}</tr></thead><tbody>${list.map(p=>`<tr><td>${esc(cname(p.client))}</td><td>${esc(p.service)}</td><td>${p.total}</td><td><input style="width:75px" aria-label="${t('used')}" type="number" min="0" max="${p.total}" value="${p.used}" onchange="editPackage('${p.id}','used',this.value)"></td><td><input style="width:115px" aria-label="${t('paid')}" type="number" min="0" max="${p.price}" step="0.01" value="${p.paid}" onchange="editPackage('${p.id}','paid',this.value)"></td><td>${money(p.price-p.paid)}</td></tr>`).join('')}</tbody></table>${list.length?'':`<div class="empty">${t('noData')}</div>`}</div>`}function addPackage(e){let p=data(e);for(let k of ['total','used','price','paid'])p[k]=Number(p[k]);if(p.used>p.total||p.paid>p.price||Object.values(p).some(v=>typeof v==='number'&&v<0)){alert('Check package values');return}db.packages.push({...p,id:id()});done()}function editPackage(pid,k,v){let p=db.packages.find(x=>x.id===pid),n=Number(v);if(!p||!Number.isFinite(n)||n<0||n>Number(k==='used'?p.total:p.price)){alert('Invalid value');render();return}p[k]=n;done()}function billing(){return billingContent(null)}document.getElementById('language').onclick=()=>{lang=lang==='es'?'en':'es';localStorage.setItem('lh_lang',lang);render()};render();
</script></body></html>
