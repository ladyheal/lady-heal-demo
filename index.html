unction soapContent(cid){let list=db.soaps.filter(x=>!cid||x.client===cid);return `<div class="row"><span class="muted">SOAP</span>${btn('+ '+t('newSOAP'),'showForm=!showForm;render()')}</div>${showForm?form(`<label>${t('client')}<select name="client" required>${clientOptions()}</select></label>${fields([['date','date','date',true],['service','service','text',true],['s','s','textarea',true],['o','o','textarea',true],['a','a','textarea',true],['p','p','textarea',true]])}`,'addSOAP'):''}<div class="section">${list.map(r=>`<div class="card section"><div class="row"><b>${esc(cname(r.client))} · ${esc(r.service)}</b><span class="pill">${esc(r.date)}</span></div>${['s','o','a','p'].map(k=>`<p><b>${t(k)}:</b> ${esc(r[k])}</p>`).join('')}</div>`).join('')||`<div class="card empty">${t('noData')}</div>`}</div>`}function addSOAP(e){db.soaps.push({...data(e),id:id()});done()}function soap(){return soapContent(null)}function appointmentContent(cid){let list=db.appointments.filter(x=>!cid||x.client===cid).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="row"><span class="muted">${t('appointments')}</span>${btn('+ '+t('newAppt'),'showForm=!showForm;render()')}</div>${showForm?form(`<label>${t('client')}<select name="client" required>${clientOptions()}</select></label>${fields([['date','date','date',true],['time','time','time',true],['service','service','text',true],['duration','duration','number',true],['location','location']])}<label>${t('status')}<select name="status"><option value="scheduled">${t('scheduled')}</option><option value="completed">${t('completed')}</option><option value="cancelled">${t('cancelled')}</option></select></label>`,'addAppointment'):''}<div class="card section tablewrap"><table><thead><tr>${['date','time','client','service','status'].map(x=>`<th>${t(x)}</th>`).join('')}</tr></thead><tbody>${list.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.time)}</td><td>${esc(cname(a.client))}</td><td>${esc(a.service)}</td><td><select ari db.payments = db.payments || [];

const originalProfile = profile;

profile = function () {
  const c = client(selected);
  if (!c) return originalProfile();

  if (tab === 'payments') {
    return `
      <button class="btn secondary"
        onclick="tab='overview';render()">
        ← Back
      </button>

      <div class="card section">
        <h2>${esc(c.name)}</h2>

        <button class="btn"
          onclick="openPayment()">
          + New Payment
        </button>

        <div class="section">
          ${paymentHistory(c.id)}
        </div>
      </div>
    `;
  }

  return originalProfile().replace(
    '<div class="tabs">',
    `<div class="tabs">
      <button class="tab"
        onclick="tab='payments';render()">
        💳 Payments
      </button>
      <button class="btn"
        onclick="openPayment()">
        + New Payment
      </button>`
  );
};

let paymentAmount = "";
let paymentTip = 0;
let paymentCustom = false;

  if (!selected || !client(selected)) {

  }

function pressNumber(n) {
  if (n === "C") {
    paymentAmount = "";
  } else if (n === "⌫") {
    paymentAmount = paymentAmount.slice(0,-1);
  } else {
    if (paymentAmount.length < 9) {
      paymentAmount += n;
    }
  }

  updatePayment();
}

function getAmount() {
  return Number(paymentAmount || 0) / 100;
}

function setTip(n) {
  paymentTip = n;
  paymentCustom = false;
  updatePayment();
}

function customTip() {
  const value = prompt("Enter custom tip amount ($)");

  if (value === null) return;

  const n = Number(value);

  if (!Number.isFinite(n) || n < 0) {
    alert("Invalid tip amount");
    return;
  }

  paymentTip = Math.round(n * 100) / 100;
  paymentCustom = true;

  updatePayment();
}

function getTipAmount() {
  const amount = getAmount();

  return paymentCustom
    ? paymentTip
    : Math.round(amount * paymentTip) / 100;
}

function updatePayment() {
  const amount = getAmount();
  const tip = getTipAmount();
  const total = amount + tip;

  document.getElementById("paymentDisplay")
    .textContent = money(amount);

  document.getElementById("paymentSummary")
    .innerHTML = `
      <p>Service: ${money(amount)}</p>
      <p>Tip: ${money(tip)}</p>
      <h2>Total: ${money(total)}</h2>
    `;
}

function confirmPayment() {
  const amount = getAmount();

  if (amount <= 0) {
    alert("Enter service amount");
    return;
  }

  const tip = getTipAmount();
  const total = Math.round((amount + tip) * 100) / 100;

  const overlay = document.getElementById("paymentOverlay");

  overlay.querySelector("div").innerHTML = `
    <h2>Confirm Payment</h2>

    <p>Client: ${esc(cname(selected))}</p>
    <p>Service: ${money(amount)}</p>
    <p>Tip: ${money(tip)}</p>

    <h2>Total: ${money(total)}</h2>

    <p class="muted">
      Save only after receiving payment
      on your iPhone.
    </p>

    <button class="btn"
      onclick="savePayment()">
      Save Payment
    </button>

    <button class="btn secondary"
      onclick="closePayment()">
      Cancel
    </button>
  `;
}

function savePayment() {
  const amount = getAmount();
  const tip = getTipAmount();

  db.payments.push({
    id: id(),
    client: selected,
    date: new Date().toISOString(),
    amount: amount,
    tip: tip,
    total: Math.round((amount + tip) * 100) / 100
  });

  persist();
  closePayment();

  tab = "payments";
  render();

  alert("Payment saved successfully");
}

function paymentHistory(cid) {
  const records = db.payments
    .filter(p => p.client === cid)
    .sort((a,b) => b.date.localeCompare(a.date));

  if (!records.length) {
    return `<p>No payments recorded.</p>`;
  }

  return records.map(p => `
    <div class="card section">
      <p>${esc(new Date(p.date).toLocaleString())}</p>
      <p>Service: ${money(p.amount)}</p>
      <p>Tip: ${money(p.tip)}</p>
      <h3>Total: ${money(p.total)}</h3>
    </div>
  `).join("");
}

function closePayment() {
  document.getElementById("paymentOverlay")?.remove();

function initializeAssessmentCanvas() {
  const canvas = document.getElementById("assessmentCanvas");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#3C322D";

  if (assessmentSignature) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img,0,0,canvas.width,canvas.height);
    img.src = assessmentSignature;
  }

  let drawing = false;
  let hasMoved = false;

  function point(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x:(e.clientX-r.left)*canvas.width/r.width,
      y:(e.clientY-r.top)*canvas.height/r.height
    };
  }

  canvas.addEventListener("pointerdown", e => {
    drawing = true;
    hasMoved = false;
    canvas.setPointerCapture(e.pointerId);
    const p = point(e);
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    assessmentSignature = canvas.toDataURL();
  });

  canvas.addEventListener("pointermove", e => {
    if (!drawing) return;
    const p = point(e);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    hasMoved = true;
  });

  function finish() {
    if (!drawing) return;
    drawing = false;
    assessmentSignature = canvas.toDataURL();
  }

  canvas.addEventListener("pointerup", finish);
  canvas.addEventListener("pointercancel", finish);
}

function clearAssessmentSignature() {
  assessmentSignature = "";
  const canvas = document.getElementById("assessmentCanvas");
  if (canvas) canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
}

  try {
    persist();
  } catch (error) {
    db.assessments.pop();
    alert(assessmentText(
      "No se pudo guardar. El almacenamiento del navegador puede estar lleno.",
      "Could not save. Browser storage may be full."
    ));
    return;
  }

  assessmentActive = false;
  assessmentDraft = {};
  assessmentSignature = "";

  selected = cid;
  page = "profile";
  tab = "medical";
  showForm = false;

  render();

  alert(assessmentText(
    "Evaluación de demostración guardada.",
    "Demo assessment saved."
  ));
}

const originalAssessmentContent = assessmentContent;

assessmentContent = function(cid) {
  const records = (db.assessments || [])
    .filter(r => !cid || r.client === cid)
    .sort((a,b) => String(b.date).localeCompare(String(a.date)));

  return `
    <div class="card">
      <h2>${t("forms")}</h2>

      <div class="row">
        <button class="btn"
          onclick="startAssessment('massage',${cid ? `'${cid}'` : 'null'})">
          💆 Massage Assessment
        </button>

        <button class="btn"
          onclick="startAssessment('facial',${cid ? `'${cid}'` : 'null'})">
          ✨ Facial Assessment
        </button>
      </div>
    </div>

    <div class="section">
      ${records.map(r=>`
        <div class="card section">
          <div class="row">
            <b>${esc(cname(r.client))}</b>
            <span class="pill">${esc(r.date)}</span>
          </div>

          <h3>${r.type==="massage"
            ? "Massage Assessment"
            : r.type==="facial"
              ? "Facial Assessment"
              : esc(t(r.type))}</h3>

          ${r.answers
            ? Object.entries(r.answers).map(([k,v])=>`
                <p><b>${esc(k)}:</b> ${esc(v)}</p>
              `).join("")
            : Object.entries(r)
                .filter(([k,v])=>!["id","client","type","date"].includes(k))
                .map(([k,v])=>`<p><b>${esc(t(k))}:</b> ${esc(v)}</p>`)
                .join("")
          }

          ${r.signature
            ? `<p><b>Demo signature:</b></p>
               <img src="${r.signature}" alt="Demo signature"
                 style="max-width:100%;border:1px solid #ddd;border-radius:8px">`
            : ""}
        </div>
      `).join("") || `<div class="card empty">${t("noData")}</div>`}
    </div>
  `;
};

const originalRenderAssessment = render;

render = function() {
  if (assessmentActive) {
    document.documentElement.lang = assessmentLanguage;
    document.getElementById("language").textContent =
      assessmentLanguage==="es" ? "English" : "Español";
    document.getElementById("title").textContent = "Assessment";
    renderAssessmentEditor();
    return;
  }

  originalRenderAssessment();
};

const originalLanguageClick = document.getElementById("language").onclick;

document.getElementById("language").onclick = () => {
  if (assessmentActive) {
    switchAssessmentLanguage(assessmentLanguage==="es"?"en":"es");
  } else {
    originalLanguageClick();
  }
};</script></body></html>
